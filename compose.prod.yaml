services:
  db:
    image: mysql:26
    container_name: url-shortening-service-db-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 3

  api:
    build:
      context: api
      dockerfile: Dockerfile.prod
    container_name: url-shortening-service-api-prod
    ports:
      - "${API_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

  ui:
    build:
      context: ui
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL_SERVER: ${NEXT_PUBLIC_API_BASE_URL_SERVER}
        NEXT_PUBLIC_API_BASE_URL_CLIENT: ${NEXT_PUBLIC_API_BASE_URL_CLIENT}
        NEXT_PUBLIC_UI_BASE_URL: ${NEXT_PUBLIC_UI_BASE_URL}
    container_name: url-shortening-service-ui-prod
    ports:
      - "${UI_PORT}:3000"
    depends_on:
      - api
